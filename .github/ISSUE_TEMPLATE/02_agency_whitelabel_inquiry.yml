name: "Public service question"
description: "Non-sensitive questions about fixed-format CSV reporting"
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is PUBLIC. Do not post email addresses, customer or business data,
        attachments, credentials, or private links. Private intake is closed until an
        authorized mailbox is configured. Scope, price and timeline follow sample review.
  - type: textarea
    id: question
    attributes:
      label: "Non-sensitive question"
      description: "Describe the report you need without real operating data."
    validations:
      required: true
